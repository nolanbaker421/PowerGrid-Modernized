modLoader = "javafml"
loaderVersion = "[1,)"
license = "Apache-2.0"

[[mods]]
modId = "powergrid_modernized"
version = "${version}"
displayName = "PowerGrid: Modernized"
authors = "Nolan Baker"
description = '''
Computer-facing instrumentation and drives for Create: Power Grid.
Adds the Variable Frequency Drive, Analog I/O Module, Clamp Meter, Line Voltmeter, Line Ammeter,
Cat6 network cabling, US-style breaker panels (single, split-phase and three-phase) with plug-on breakers,
split-phase and three-phase transformers,
with ComputerCraft peripherals and OpenComputers network nodes.
AC build: needs the powergrid-ac fork of Power Grid (v0.6.1-ac.7 or newer); meters read RMS and real power.
'''

[[dependencies.powergrid_modernized]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.powergrid_modernized]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.powergrid_modernized]]
modId = "powergrid"
type = "required"
versionRange = "${powergrid_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.powergrid_modernized]]
modId = "create"
type = "required"
versionRange = "${create_forge_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.powergrid_modernized]]
modId = "computercraft"
type = "optional"
versionRange = "[1.120.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.powergrid_modernized]]
modId = "opencomputers"
type = "optional"
versionRange = "[1.9.4,)"
ordering = "AFTER"
side = "BOTH"
