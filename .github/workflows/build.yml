name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Power Grid jar the addon compiles against is not in the repository (libs/ is ignored).
      # Set the repository variable POWERGRID_JAR_URL (main, stock Power Grid) and POWERGRID_AC_JAR_URL
      # (ac branch, the DaRealML/powergrid-ac release) to direct download links of those jars.
      - name: Fetch the Power Grid jar
        env:
          JAR_URL: ${{ github.ref_name == 'ac' && vars.POWERGRID_AC_JAR_URL || vars.POWERGRID_JAR_URL }}
        run: |
          jar=$(grep '^powergrid_jar=' gradle.properties | cut -d= -f2)
          if [ -z "$JAR_URL" ]; then
            echo "::error::Set the repository variable POWERGRID_JAR_URL (or POWERGRID_AC_JAR_URL for the ac branch) to a download link for $jar"
            exit 1
          fi
          mkdir -p "$(dirname "$jar")"
          curl -fL "$JAR_URL" -o "$jar"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: powergrid-modernized-${{ github.ref_name }}
          path: build/libs/*.jar
