name: Build

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The mod compiles against the powergrid-ac fork (a superset of stock Power Grid on every class
      # the mod uses) and runs on either. Neither jar is in the repository (libs/ is ignored). Set the
      # repository variables POWERGRID_AC_JAR_URL (the fork release the build targets) and
      # POWERGRID_JAR_URL (the stock release) to direct download links.
      - name: Fetch the Power Grid jars
        env:
          AC_URL: ${{ vars.POWERGRID_AC_JAR_URL }}
          STOCK_URL: ${{ vars.POWERGRID_JAR_URL }}
        run: |
          jar=$(grep '^powergrid_jar=' gradle.properties | cut -d= -f2)
          if [ -z "$AC_URL" ] || [ -z "$STOCK_URL" ]; then
            echo "::error::Set the repository variables POWERGRID_AC_JAR_URL (for $jar) and POWERGRID_JAR_URL (stock Power Grid)"
            exit 1
          fi
          mkdir -p "$(dirname "$jar")"
          curl -fL "$AC_URL" -o "$jar"
          curl -fL "$STOCK_URL" -o libs/powergrid-stock.jar

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle (against the fork)
        run: ./gradlew build

      # Everything outside the ac package must also compile against stock Power Grid: this is what
      # keeps the one jar loadable without the fork.
      - name: Check stock Power Grid compatibility
        run: ./gradlew compileJava -PstockCompat=true -Ppowergrid_jar=libs/powergrid-stock.jar --rerun-tasks

      - name: Read the mod version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: powergrid-modernized
          path: build/libs/*.jar

  # Every push to main whose mod_version has no release yet gets one: the tag v<version>, the mod
  # jar, and that version's section of CHANGELOG.md as the notes. Bumping mod_version is the
  # release switch; a push that leaves it alone only builds.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether this version is new
        id: check
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Release v$VERSION already exists; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the built jars
        if: steps.check.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          name: powergrid-modernized
          path: jars

      - name: Pick the mod jar and write the notes
        if: steps.check.outputs.new == 'true'
        id: notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          base=$(grep '^archives_base_name=' gradle.properties | cut -d= -f2)
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          jar="jars/${base}-mc${mc}-${VERSION}.jar"
          test -f "$jar" || { echo "::error::$jar not built"; ls jars; exit 1; }
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          # The CHANGELOG section for this version: from its heading to the next.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md entry for $VERSION." > notes.md
          fi
          {
            echo ""
            echo "Needs NeoForge 21.1 on Minecraft ${mc}, Create 6, and Create: Power Grid. The AC features need the powergrid-ac fork; the rest loads on stock Power Grid."
          } >> notes.md
          echo "Notes:"; cat notes.md

      - name: Publish the release
        if: steps.check.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: notes.md
          files: ${{ steps.notes.outputs.jar }}
          fail_on_unmatched_files: true
