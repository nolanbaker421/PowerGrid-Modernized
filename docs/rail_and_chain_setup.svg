<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 L0,0 L0,40" fill="none" stroke="#ddd" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="980" fill="#fafafa"/>

  <text x="30" y="40" font-size="26" font-weight="700" fill="#222">Conductor rail and cable chain: how to set them up</text>
  <text x="30" y="64" fill="#555">Each square is one block. Side views; the trolley is a Create Aeronautics body.</text>

  <!-- ================= Panel 1: rail under a runway beam ================= -->
  <g transform="translate(30,90)">
    <text x="0" y="0" font-size="19" font-weight="700" fill="#222">1. Rail hung under the runway beam (rail facing UP, collector facing UP)</text>
    <rect x="0" y="14" width="560" height="360" fill="url(#grid)" stroke="#bbb"/>
    <!-- beam -->
    <rect x="0" y="14" width="560" height="40" fill="#c9a24a" stroke="#8a6d25"/>
    <text x="10" y="40" fill="#5a4410" font-weight="700">runway beam (any block)</text>
    <!-- rail row -->
    <g>
      <rect x="0" y="54" width="560" height="40" fill="#f3f3f3" stroke="#bbb"/>
      <!-- bracket -->
      <rect x="0" y="54" width="560" height="6" fill="#7c8086"/>
      <!-- bars -->
      <rect x="0" y="62" width="560" height="5" fill="#e87018"/>
      <rect x="0" y="69" width="560" height="5" fill="#e87018"/>
      <rect x="0" y="76" width="560" height="5" fill="#e87018"/>
      <rect x="0" y="83" width="560" height="5" fill="#e87018"/>
      <text x="400" y="110" fill="#b04e00" font-weight="700">Conductor Rail blocks, laid end to end</text>
      <!-- feed box in the run -->
      <rect x="200" y="54" width="40" height="40" fill="#3a3c42" stroke="#111"/>
      <rect x="206" y="72" width="28" height="5" fill="#e87018"/>
      <text x="245" y="110" fill="#222" font-weight="700">Rail Feed Box</text>
      <text x="245" y="128" fill="#555">sits in the run; bars run out both sides</text>
      <!-- conduit to the feed -->
      <path d="M220,14 L220,54" stroke="#9aa0a6" stroke-width="8" fill="none"/>
      <text x="228" y="40" fill="#555">conduit into the 4" knockout</text>
    </g>
    <!-- gap row: collector arm reaches up into the rail block -->
    <rect x="0" y="94" width="560" height="40" fill="none"/>
    <!-- trolley body -->
    <rect x="60" y="134" width="200" height="120" fill="#e9d36b" stroke="#a08a2a"/>
    <text x="70" y="240" fill="#5a4410" font-weight="700">trolley (physics body)</text>
    <!-- collector box on top of the trolley, facing up -->
    <rect x="120" y="94" width="40" height="40" fill="#3a3c42" stroke="#111"/>
    <rect x="128" y="112" width="24" height="4" fill="#e87018"/>
    <!-- arm up into the rail block -->
    <rect x="137" y="62" width="6" height="34" fill="#7c8086"/>
    <rect x="130" y="60" width="20" height="4" fill="#c07a3a"/>
    <text x="170" y="120" fill="#222" font-weight="700">Rail Collector</text>
    <text x="170" y="138" fill="#555">on the trolley, its front toward the bars</text>
    <!-- arrows -->
    <line x1="150" y1="78" x2="330" y2="78" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
    <text x="335" y="82" fill="#333">shoes sit inside the rail block above</text>
    <!-- gap callout -->
    <path d="M30,94 L30,134" stroke="#c00" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="0" y="300" fill="#c00" font-weight="700">The collector must be exactly one block from the rail,</text>
    <text x="0" y="320" fill="#c00" font-weight="700">with the rail block directly in front of its arm.</text>
    <text x="0" y="350" fill="#555">Place the rail on the beam's underside (click the beam from below): it gets facing UP.</text>
    <text x="0" y="368" fill="#555">Place the collector on the trolley's top: facing UP too, so its arm points up at the rail.</text>
  </g>

  <!-- ================= Panel 2: rail beside the runway (wall) ================= -->
  <g transform="translate(620,90)">
    <text x="0" y="0" font-size="19" font-weight="700" fill="#222">2. Rail on a wall beside the runway (both facing sideways)</text>
    <rect x="0" y="14" width="550" height="360" fill="url(#grid)" stroke="#bbb"/>
    <!-- wall -->
    <rect x="0" y="14" width="40" height="360" fill="#9a9a9a" stroke="#666"/>
    <text x="8" y="200" fill="#333" font-weight="700" transform="rotate(-90 8 200)">wall / runway side</text>
    <!-- rail column -->
    <rect x="40" y="14" width="40" height="360" fill="#f3f3f3" stroke="#bbb"/>
    <rect x="40" y="14" width="6" height="360" fill="#7c8086"/>
    <rect x="48" y="14" width="5" height="360" fill="#e87018"/>
    <rect x="55" y="14" width="5" height="360" fill="#e87018"/>
    <rect x="62" y="14" width="5" height="360" fill="#e87018"/>
    <rect x="69" y="14" width="5" height="360" fill="#e87018"/>
    <!-- feed box -->
    <rect x="40" y="54" width="40" height="40" fill="#3a3c42" stroke="#111"/>
    <text x="90" y="80" fill="#222" font-weight="700">Rail Feed Box in the run</text>
    <!-- trolley -->
    <rect x="160" y="140" width="220" height="140" fill="#e9d36b" stroke="#a08a2a"/>
    <text x="170" y="265" fill="#5a4410" font-weight="700">trolley (physics body)</text>
    <!-- collector on the trolley's side facing the wall -->
    <rect x="120" y="180" width="40" height="40" fill="#3a3c42" stroke="#111"/>
    <rect x="128" y="188" width="4" height="24" fill="#e87018"/>
    <!-- arm into rail column -->
    <rect x="86" y="197" width="34" height="6" fill="#7c8086"/>
    <rect x="80" y="190" width="4" height="20" fill="#c07a3a"/>
    <text x="170" y="205" fill="#222" font-weight="700">Rail Collector on the trolley's side,</text>
    <text x="170" y="223" fill="#222" font-weight="700">front toward the wall</text>
    <path d="M100,230 L100,180" stroke="#c00" stroke-width="2" fill="none"/>
    <text x="90" y="300" fill="#c00" font-weight="700">one block gap, rail block straight ahead</text>
    <text x="0" y="400" fill="#555">Here you place the rail on the wall (click the wall), and the collector on the</text>
    <text x="0" y="418" fill="#555">trolley's wall-facing side. Both end up facing the same way.</text>
  </g>

  <!-- ================= Panel 3: wiring at the feed ================= -->
  <g transform="translate(30,540)">
    <text x="0" y="0" font-size="19" font-weight="700" fill="#222">3. Wiring at the feed box and at the collector (both are pull boxes)</text>
    <rect x="0" y="14" width="560" height="200" fill="#fff" stroke="#bbb"/>
    <rect x="30" y="60" width="150" height="110" fill="#3a3c42" stroke="#111"/>
    <text x="40" y="52" fill="#222" font-weight="700">Rail Feed Box</text>
    <circle cx="60" cy="95" r="7" fill="#d03030"/><text x="72" y="100" fill="#fff">L1</text>
    <circle cx="60" cy="118" r="7" fill="#e0a020"/><text x="72" y="123" fill="#fff">L2</text>
    <circle cx="60" cy="141" r="7" fill="#3060d0"/><text x="72" y="146" fill="#fff">L3</text>
    <circle cx="60" cy="160" r="7" fill="#e8e8e8"/><text x="72" y="165" fill="#fff">N</text>
    <rect x="150" y="70" width="20" height="20" fill="#2fb8d6"/><text x="104" y="84" fill="#fff">knockout</text>
    <rect x="150" y="140" width="20" height="14" fill="#5ad0ff"/><text x="110" y="151" fill="#fff">Cat6</text>
    <!-- conduit in -->
    <path d="M170,80 L330,80" stroke="#9aa0a6" stroke-width="8"/>
    <text x="200" y="72" fill="#555">4" conduit from the panel or regulator</text>
    <!-- cat6 -->
    <path d="M170,147 L330,147" stroke="#2f6fd6" stroke-width="3"/>
    <text x="200" y="165" fill="#2f6fd6">Cat6 to the computer or switch</text>
    <text x="30" y="195" fill="#222">Empty hand on the box: splice the conduit's conductors to L1, L2, L3, N.</text>
    <text x="30" y="212" fill="#222">Those studs are the four bars. Or land THHN on the studs directly.</text>
    <!-- collector mirror -->
    <rect x="380" y="60" width="150" height="110" fill="#3a3c42" stroke="#111"/>
    <text x="390" y="52" fill="#222" font-weight="700">Rail Collector (on the trolley)</text>
    <circle cx="410" cy="95" r="7" fill="#d03030"/><circle cx="410" cy="118" r="7" fill="#e0a020"/>
    <circle cx="410" cy="141" r="7" fill="#3060d0"/><circle cx="410" cy="160" r="7" fill="#e8e8e8"/>
    <rect x="500" y="70" width="20" height="20" fill="#2fb8d6"/>
    <rect x="500" y="140" width="20" height="14" fill="#5ad0ff"/>
    <text x="430" y="100" fill="#fff">same four studs</text>
    <text x="430" y="123" fill="#fff">= the bars while</text>
    <text x="430" y="146" fill="#fff">the shoes touch</text>
    <text x="430" y="167" fill="#fff">a fed rail</text>
  </g>

  <!-- ================= Panel 4: cable chain ================= -->
  <g transform="translate(620,540)">
    <text x="0" y="0" font-size="19" font-weight="700" fill="#222">4. Cable chain instead (short travel, a raceway you can see)</text>
    <rect x="0" y="14" width="550" height="200" fill="url(#grid)" stroke="#bbb"/>
    <!-- fixed anchor on the structure -->
    <rect x="20" y="154" width="40" height="40" fill="#3a3c42" stroke="#111"/>
    <text x="10" y="150" fill="#222" font-weight="700">fixed anchor (click first)</text>
    <!-- trolley with anchor -->
    <rect x="330" y="120" width="180" height="80" fill="#e9d36b" stroke="#a08a2a"/>
    <rect x="330" y="80" width="40" height="40" fill="#3a3c42" stroke="#111"/>
    <text x="300" y="72" fill="#222" font-weight="700">body anchor (click second)</text>
    <!-- chain path: lower run, bend, upper run -->
    <path d="M60,174 L220,174 A 25 25 0 0 1 220,124 L330,100" stroke="#3a3c42" stroke-width="7" fill="none" stroke-dasharray="10 5"/>
    <text x="90" y="195" fill="#555">lower run</text>
    <text x="230" y="118" fill="#555">bend</text>
    <text x="0" y="230" fill="#222">Pull THHN through the chain like conduit (click it near the fixed anchor). Splice in each anchor.</text>
    <text x="0" y="248" fill="#222">Cat6 is built in. String it with the trolley at the far end of its travel; add links later by clicking it.</text>
  </g>

  <text x="30" y="820" font-size="17" font-weight="700" fill="#222">Rules of thumb</text>
  <text x="30" y="845" fill="#222">• Assemble the trolley into a body first, then place the collector or string the chain.</text>
  <text x="30" y="867" fill="#222">• Rail: one feed per run, anywhere in it. Runs can turn corners as long as the blocks touch. A run without a feed is dead.</text>
  <text x="30" y="889" fill="#222">• Collector: exactly one block from the rail, arm pointing at it. Goggles on it say "On the rail, fed from x, y, z" when it has contact.</text>
  <text x="30" y="911" fill="#222">• Both the feed box and the collector take THHN on their studs, conduit on the knockout, Cat6 on the jack. Empty hand opens the splice editor.</text>
  <text x="30" y="933" fill="#222">• The rail is for long runways; the chain for short travel where you want to see the raceway and pull wire through it.</text>
</svg>
